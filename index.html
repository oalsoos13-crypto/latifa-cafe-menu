<title>لطيفة كافيه — المنيو</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6B3FA0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --purple:#6B3FA0; --purple-d:#4E2B78; --lav:#F4EFFA; --lav-2:#E9E0F5;
  --lime:#C7E86B; --ink:#2E2440; --muted:#8A7BA3; --card:#ffffff;
  --r:22px; --shadow:0 6px 24px rgba(78,43,120,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--lav);color:var(--ink);overflow-x:hidden;touch-action:manipulation}
body.en{direction:ltr}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--purple) 0%,var(--purple-d) 100%);
  color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.hdr .logo{width:54px;height:54px;border-radius:16px;background:#fff;padding:5px;object-fit:contain;flex:none}
.hdr .ttl{flex:1;min-width:0}
.hdr h1{font-size:clamp(19px,2.6vw,26px);font-weight:900;line-height:1.2}
.hdr p{font-size:clamp(12px,1.6vw,14px);opacity:.85;font-weight:600}
.btn{border:0;cursor:pointer;font-family:inherit}
.lang-btn{background:var(--lime);color:#3A4A12;font-weight:800;font-size:16px;padding:10px 20px;border-radius:999px;flex:none}
.back-btn{background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:16px;padding:10px 20px;border-radius:999px;
  display:none;align-items:center;gap:8px;flex:none}
.back-btn .ar-arrow{display:inline-block}
body.cat .back-btn{display:flex}

/* ---------- screens ---------- */
.screen{display:none;animation:fade .28s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:1400px;margin:0 auto;padding:22px clamp(14px,3vw,34px) 60px}

/* ---------- home grid ---------- */
.home-title{font-size:clamp(20px,3vw,28px);font-weight:900;margin:6px 4px 18px;color:var(--purple-d)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(160px,22vw,250px),1fr));gap:clamp(12px,2vw,22px)}
.cat-tile{position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);
  aspect-ratio:4/3.4;background:var(--lav-2);transform:translateZ(0);transition:transform .15s ease}
.cat-tile:active{transform:scale(.96)}
.cat-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat-tile .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,15,55,0) 38%,rgba(30,15,55,.82) 100%)}
.cat-tile .lbl{position:absolute;bottom:0;inset-inline:0;padding:14px 16px;color:#fff}
.cat-tile .lbl b{display:block;font-size:clamp(16px,2vw,21px);font-weight:900;line-height:1.25}
.cat-tile .lbl span{font-size:clamp(11px,1.4vw,13px);font-weight:600;opacity:.85}
.cat-tile.bfast{outline:3px solid var(--lime);outline-offset:-3px}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--lime);color:#3A4A12;
  font-size:clamp(11px,1.4vw,13px);font-weight:800;padding:5px 12px;border-radius:999px}

/* ---------- items grid ---------- */
.cat-head{display:flex;align-items:baseline;gap:12px;margin:6px 4px 18px}
.cat-head h2{font-size:clamp(22px,3.2vw,30px);font-weight:900;color:var(--purple-d)}
.cat-head span{font-size:clamp(13px,1.6vw,15px);color:var(--muted);font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,20vw,230px),1fr));gap:clamp(12px,2vw,20px)}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:default;
  display:flex;flex-direction:column;transition:transform .15s ease}
.card:active{transform:scale(.97)}
.ph{position:relative;aspect-ratio:1/1;background:var(--lav-2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;
  background:linear-gradient(135deg,var(--lav-2),#DCCDF0);color:var(--purple)}
.card .inf{padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .nm{font-size:clamp(13.5px,1.7vw,16px);font-weight:800;line-height:1.35;min-height:2.6em}
.price{margin-top:auto;align-self:flex-start;background:var(--lav);color:var(--purple-d);
  font-weight:900;font-size:clamp(12.5px,1.6vw,15.5px);padding:5px 13px;border-radius:16px;border:1.5px solid var(--lav-2);text-align:center;line-height:1.3}
.price small{font-weight:700;font-size:.78em;color:var(--muted);margin-inline-end:4px}

/* zoom overlay */
.zoom{position:fixed;inset:0;z-index:100;background:rgba(30,15,55,.78);display:none;align-items:center;justify-content:center;padding:30px}
.zoom.on{display:flex;animation:fade .2s ease}
.zoom .box{background:#fff;border-radius:26px;overflow:hidden;max-width:min(560px,92vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.zoom img{width:100%;max-height:62vh;object-fit:cover;display:block}
.zoom .zi{padding:16px 20px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.zoom .zi b{font-size:20px;font-weight:900}
footer{padding:26px 20px 40px;text-align:center;color:var(--muted);font-weight:700;font-size:13px}

/* ---------- slideshow (attract mode) ---------- */
.slideshow{position:fixed;inset:0;z-index:200;display:none;cursor:pointer;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 30%,#3A2260 0%,#1E0F37 70%)}
.slideshow.on{display:block;animation:fade .5s ease}
.ss-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4vh 4vw 9vh;opacity:0;
  transition:opacity .9s ease;transform-origin:center;filter:drop-shadow(0 18px 45px rgba(0,0,0,.45))}
.ss-img.show{opacity:1;animation:kb 3.6s ease-in-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.03)}}
.ss-brand{position:absolute;top:26px;inset-inline-start:26px;display:flex;align-items:center;gap:12px;
  background:rgba(30,15,55,.55);backdrop-filter:blur(8px);padding:10px 18px;border-radius:999px;color:#fff}
.ss-brand img{width:40px;height:40px;border-radius:12px;background:#fff;padding:3px;object-fit:contain}
.ss-brand b{font-size:20px;font-weight:900}
.ss-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--lime);color:#3A4A12;font-weight:900;font-size:clamp(15px,2vw,19px);
  padding:12px 28px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
</style>
</head>

to", "cover": "https://ksacdn4.mnasaticdn.com/uploads/category_image/12999/category_17920_1674374247_thumb.jpg", "items": [{"ar": "موهيتو", "en": "Mojito", "img": "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01666720832_thumb.jpg", "pFrom": 1.25}]}];
const T = {
  ar:{cafe:'لطيفة كافيه',sub:'منيو المقهى — اضغط على أي قسم',secs:'الأقسام',back:'رجوع',items:'صنف',
      from:'يبدأ من',kd:'د.ك',ask:'اسأل الكاشير',flavor:'حسب النكهة',bfBadge:'فطورك على كيفك',szS:'صغير',szM:'وسط',szL:'كبير',szK:'أطفال'},
  en:{cafe:'Latifa Cafe',sub:'Cafe menu — tap any category',secs:'Categories',back:'Back',items:'items',
      from:'From',kd:'KD',ask:'Ask cashier',flavor:'By flavor',bfBadge:'Your breakfast, your way',szS:'Small',szM:'Medium',szL:'Large',szK:'Kids'}
};
let lang='ar', curCat=null;

const fmt = v => v.toFixed(3);
function priceHTML(it){
  const t=T[lang];
  if(it.sizes)       return it.sizes.map(s=>`${t['sz'+s[0]]} ${fmt(s[1])}`).join(' · ') + ` <small>${t.kd}</small>`;
  if(it.p!=null)     return `${fmt(it.p)} <small>${t.kd}</small>`;
  if(it.pFrom!=null) return `<small>${t.from}</small> ${fmt(it.pFrom)} <small>${t.kd}</small>`;
  return `<small>${t.flavor}</small>`;
}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}

function renderHome(){
  const g=document.getElementById('catsGrid');g.innerHTML='';
  DATA.forEach((c,i)=>{
    const name=lang==='ar'?c.ar:c.en;
    const tile=el(`<div class="cat-tile ${c.id==='breakfast'?'bfast':''}" role="button">
      <img loading="lazy" src="${c.cover}" onerror="this.remove()">
      <div class="shade"></div>
      ${c.id==='breakfast'?`<div class="badge">${T[lang].bfBadge}</div>`:''}
      <div class="lbl"><b>${name}</b><span>${c.items.length} ${T[lang].items}</span></div>
    </div>`);
    tile.addEventListener('click',()=>openCat(i));
    g.appendChild(tile);
  });
}
function renderCat(){
  const c=DATA[curCat], t=T[lang];
  document.getElementById('catName').textContent = lang==='ar'?c.ar:c.en;
  document.getElementById('catCount').textContent = `${c.items.length} ${t.items}`;
  const g=document.getElementById('itemsGrid');g.innerHTML='';
  c.items.forEach(it=>{
    const name=lang==='ar'?it.ar:(it.en||it.ar);
    const card=el(`<div class="card">
      <div class="ph"><img loading="lazy" src="${it.img}" onerror="this.outerHTML='<div class=fb>☕</div>'"></div>
      <div class="inf"><div class="nm">${name}</div><span class="price">${priceHTML(it)}</span></div>
    </div>`);
    card.addEventListener('click',()=>openZoom(it));
    g.appendChild(card);
  });
}
function openCat(i){curCat=i;document.body.classList.add('cat');
  swap('catScr');renderCat();window.scrollTo(0,0);}
function goHome(){curCat=null;document.body.classList.remove('cat');
  swap('homeScr');window.scrollTo(0,0);}
function swap(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  const s=document.getElementById(id);s.classList.add('on');}

function openZoom(it){
  document.getElementById('zImg').src=it.img;
  document.getElementById('zName').textContent=lang==='ar'?it.ar:(it.en||it.ar);
  document.getElementById('zPrice').innerHTML=priceHTML(it);
  document.getElementById('zoom').classList.add('on');
}
document.getElementById('zoom').addEventListener('click',()=>document.getElementById('zoom').classList.remove('on'));

function applyLang(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('en',lang==='en');
  document.getElementById('hTitle').textContent=t.cafe;
  document.getElementById('hSub').textContent=t.sub;
  document.getElementById('homeTitle').textContent=t.secs;
  document.getElementById('backTxt').textContent=t.back;
  document.getElementById('backArrow').textContent=lang==='ar'?'→':'←';
  document.getElementById('langBtn').textContent=lang==='ar'?'EN':'عربي';
  renderHome();
  if(curCat!=null)renderCat();
}
document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';applyLang();resetIdle();});
document.getElementById('backBtn').addEventListener('click',goHome);

/* ---------- attract-mode slideshow ---------- */
const IDLE_MS = 60000;   // 1 minute of no touch -> slideshow
const SLIDE_MS = 3000;   // each photo 3 seconds
function buildSlides(){
  const urls = [];
  const add = u => { if(u && !urls.includes(u)) urls.push(u); };
  const bf = DATA.find(c=>c.id==='breakfast');
  if(bf){ add(bf.cover); bf.items.forEach(it=>add(it.img)); }
  const ms = DATA.find(c=>c.id==='12990');
  if(ms) ms.items.forEach(it=>add(it.img));
  DATA.forEach(c=>{ if(c.id!=='breakfast'&&c.id!=='12990') add(c.cover); });
  return urls;
}
const SLIDES = buildSlides();
const hi = {}; // thumb url -> best available url (original if it loads)
function resolveHi(u){
  if(u.startsWith('data:') || hi[u] || !u.includes('_thumb.')) { hi[u] = hi[u]||u; return; }
  const full = u.replace(/_thumb\.(jpe?g|png)/i, '.$1');
  const im = new Image();
  im.onload = ()=>{ hi[u] = full; };
  im.onerror = ()=>{ hi[u] = u; };
  im.src = full;
}
SLIDES.forEach(resolveHi);

const ssEl = document.getElementById('slideshow');
let ssOn=false, ssIdx=0, ssTimer=null, ssLayer=0;
function showSlide(){
  const url = SLIDES[ssIdx % SLIDES.length];
  const img = document.getElementById(ssLayer===0?'ssA':'ssB');
  const other = document.getElementById(ssLayer===0?'ssB':'ssA');
  img.src = hi[url] || url;
  img.classList.add('show');
  other.classList.remove('show');
  ssLayer = 1-ssLayer;
  ssIdx++;
  // preload next
  const nxt = SLIDES[ssIdx % SLIDES.length];
  const pre = new Image(); pre.src = hi[nxt] || nxt;
}
function startShow(){
  if(ssOn || !SLIDES.length) return;
  ssOn = true;
  document.getElementById('zoom').classList.remove('on');
  if(lang!=='ar'){lang='ar';applyLang();}
  if(curCat!=null)goHome();
  document.getElementById('ssTitle').textContent = T[lang].cafe;
  document.getElementById('ssHint').textContent = lang==='ar' ? 'اضغط على الشاشة لعرض المنيو' : 'Tap the screen to view the menu';
  ssIdx = 0; ssLayer = 0;
  ssEl.classList.add('on');
  showSlide();
  ssTimer = setInterval(showSlide, SLIDE_MS);
}
function stopShow(){
  if(!ssOn) return;
  ssOn = false;
  clearInterval(ssTimer);
  ssEl.classList.remove('on');
  document.getElementById('ssA').classList.remove('show');
  document.getElementById('ssB').classList.remove('show');
  resetIdle();
}
ssEl.addEventListener('click', e=>{ e.stopPropagation(); stopShow(); });
ssEl.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); stopShow(); }, {passive:false});

/* kiosk idle: 1 min of no touch -> slideshow */
let idleTimer;
function resetIdle(){
  clearTimeout(idleTimer);
  if(ssOn) return;
  idleTimer = setTimeout(startShow, IDLE_MS);
}
['touchstart','click','scroll','pointerdown'].forEach(e=>window.addEventListener(e,()=>{ if(!ssOn) resetIdle(); },{passive:true}));
document.addEventListener('contextmenu',e=>e.preventDefault());
resetIdle();applyLang();

/* PWA: offline cache (works when hosted over https) */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
