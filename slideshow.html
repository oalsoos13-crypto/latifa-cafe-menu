<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>لطيفة كافيه — عرض الشاشة</title>
<link rel="icon" href="https://ksacdn4.mnasaticdn.com/uploads/vendor_logo_image/12999/logo_1401_1774872833.png">
<meta name="theme-color" content="#1E0F37">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--lime:#C7E86B}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#1E0F37}
body{font-family:'Cairo',system-ui,sans-serif;cursor:none}
.slideshow{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 30%,#3A2260 0%,#1E0F37 70%)}
.ss-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4vh 4vw 9vh;opacity:0;
  transition:opacity .9s ease;transform-origin:center;filter:drop-shadow(0 18px 45px rgba(0,0,0,.45))}
.ss-img.show{opacity:1;animation:kb 3.6s ease-in-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.03)}}
.ss-brand{position:absolute;top:26px;inset-inline-start:26px;display:flex;align-items:center;gap:12px;
  background:rgba(30,15,55,.55);backdrop-filter:blur(8px);padding:10px 18px;border-radius:999px;color:#fff}
.ss-brand img{width:40px;height:40px;border-radius:12px;background:#fff;padding:3px;object-fit:contain}
.ss-brand b{font-size:20px;font-weight:900}
</style>
</head>
<body>
<div class="slideshow" id="slideshow">
  <img id="ssA" class="ss-img" src="" alt="">
  <img id="ssB" class="ss-img" src="" alt="">
  <div class="ss-brand">
    <img src="https://ksacdn4.mnasaticdn.com/uploads/vendor_logo_image/12999/logo_1401_1774872833.png" onerror="this.style.display='none'">
    <b>لطيفة كافيه</b>
  </div>
</div>
<script>
/* عرض الشاشة — كان جوّا المنيو (عرض الانتظار)، وصار ملف لحاله.
   لتغيير الصور: عدّل القائمة تحت. كل صورة 3 ثواني، والعرض بيلف على طول. */
const SLIDE_MS = 3000;
const SLIDES = [
 "bagel-poster.jpg",
 "bagel-cover.jpg",
 "bagel-smoked-salmon.jpg",
 "bagel-egg-cheese.jpg",
 "bagel-halloumi.jpg",
 "bagel-labneh.jpg",
 "bagel-qaimar-honey.jpg",
 "bagel-pbj-banana.jpg",
 "bagel-tuna.jpg",
 "bagel-smoked-turkey.jpg",
 "bagel-roast-beef.jpg",
 "bagel-zaatar-berry.jpg",
 "bagel-pepperoni.jpg",
 "juice-queen-latifa.jpg",
 "juice-shugurdi.jpg",
 "mango.jpg",
 "flamingo.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01668857251_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01668857142_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01653952897_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01668857336_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01668857099_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01667323078_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01667323580_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01667324105_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01667324190_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01653951249_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01667136863_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/category_image/12999/category_13041_1674374183_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01666713836_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/category_image/12999/category_17902_1674374210_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01667042451_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/product_image/12999/product_01666794756_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/category_image/12999/category_13015_1674374130_thumb.jpg",
 "https://ksacdn4.mnasaticdn.com/uploads/category_image/12999/category_17920_1674374247_thumb.jpg"
];
const hi = {};
function resolveHi(u){
  if(u.startsWith('data:') || hi[u] || !u.includes('_thumb.')) { hi[u] = hi[u]||u; return; }
  const full = u.replace(/_thumb\.(jpe?g|png)/i, '.$1');
  const im = new Image();
  im.onload = ()=>{ hi[u] = full; };
  im.onerror = ()=>{ hi[u] = u; };
  im.src = full;
}
SLIDES.forEach(resolveHi);
let idx=0, layer=0;
function showSlide(){
  const url = SLIDES[idx % SLIDES.length];
  const img = document.getElementById(layer===0?'ssA':'ssB');
  const other = document.getElementById(layer===0?'ssB':'ssA');
  img.src = hi[url] || url;
  img.classList.remove('show'); void img.offsetWidth; img.classList.add('show');
  other.classList.remove('show');
  layer = 1-layer; idx++;
  const pre = new Image(); const nxt = SLIDES[idx % SLIDES.length]; pre.src = hi[nxt] || nxt;
}
showSlide();
setInterval(showSlide, SLIDE_MS);
/* ضغطة على الشاشة = ملء الشاشة */
document.addEventListener('click', ()=>{
  const d=document;
  if(!d.fullscreenElement && d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(()=>{});
  else if(d.exitFullscreen) d.exitFullscreen().catch(()=>{});
});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
